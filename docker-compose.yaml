services:
  postgres:
    image: postgres:16-alpine
    container_name: snippetbox-postgres
    environment:
      POSTGRES_USER: web
      POSTGRES_PASSWORD: qwe
      POSTGRES_DB: snippetbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web -d snippetbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snippetbox-web
    ports:
      - "4000:4000"
    environment:
      - ADDR=:4000
      - DSN=postgres://web:qwe@postgres:5432/snippetbox?search_path=snippets&sslmode=disable
      - DEBUG=false
      - TLS_CERT=/app/tls/cert.pem
      - TLS_KEY=/app/tls/key.pem
    volumes:
      - ./tls:/app/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
